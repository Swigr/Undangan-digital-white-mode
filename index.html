<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Hafis & Amelia (Slideshow)</title>
    <!-- Font Google -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #333;
            color: white;
            overflow-x: hidden;
            height: 100vh; /* Pastikan body penuh layar */
        }

        /* --- CSS untuk Slideshow Background --- */
        .slideshow-container {
            position: fixed; /* Menjaga background tetap di tempat */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Meletakkan slideshow di belakang konten */
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0; /* Mulai dengan transparan */
            transition: opacity 1.5s ease-in-out; /* Efek fade in/out */
        }

        /* Menampilkan slide pertama saat dimuat */
        .slide.active {
            opacity: 1;
        }

        /* Overlay gelap agar teks lebih mudah terbaca */
        .slideshow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.7));
            z-index: 1; /* Di depan slide, di belakang konten */
        }
        /* -------------------------------------- */

        /* Hero Section - Diubah untuk bekerja dengan slideshow */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 120px;
            text-align: left;
            padding-left: 30px;
            z-index: 2; /* Meletakkan konten hero di depan slideshow */
        }

        .hero-text p {
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .hero-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 10px;
        }

        .date-text {
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        /* Countdown Container */
        .save-the-date {
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            margin-left: -15px;
        }

        .countdown {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            margin-left: -15px;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px;
            border-radius: 5px;
            min-width: 65px;
            text-align: center;
        }

        .timer-box span {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .timer-box small {
            font-size: 0.6rem;
            text-transform: capitalize;
        }

        /* Music Button */
        .music-btn {
            position: absolute;
            right: 20px;
            bottom: 180px;
            background: white;
            color: black;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; /* Indikasi bisa diklik */
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(80, 80, 80, 0.9);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: #ddd;
            text-decoration: none;
            font-size: 0.7rem;
            flex: 1;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        .nav-item:last-child {
            border-right: none;
        }

        .nav-item i {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .footer-link {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.7rem;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- --- Bagian Slideshow Background --- -->
    <div class="slideshow-container">
        <div class="slideshow-overlay"></div>
        <!-- Ganti URL_FOTO_X_DISINI dengan link foto Anda -->
        <div class="slide active" style="background-image: url('Images/G-2.png');"></div>
        <div class="slide" style="background-image: url('Images/G-4.png');"></div>
        <div class="slide" style="background-image: url('Images/G-3.png');"></div>
    </div>
    <!-- --------------------------------- -->

    <section class="hero">
        <div class="hero-text">
            <p>The Wedding Of</p>
            <h1>Hafis &<br>Amelia</h1>
            <p class="date-text">Rabu, 3 Desember 2025</p>
        </div>

        <p class="save-the-date">Save The Date</p>
        
        <div class="countdown">
            <div class="timer-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>
            <div class="timer-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>
            <div class="timer-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>
            <div class="timer-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
        </div>

        <div class="music-btn" id="playMusic">
            <i class="fa-solid fa-play"></i>
        </div>
        <!-- Tambahkan audio di sini jika ingin fungsionalitas musik -->
        <!-- <audio id="weddingMusic" loop src="URL_MUSIK_ANDA_DISINI"></audio> -->
    </section>


    <nav class="bottom-nav">
        <a href="#" class="nav-item">
            <i class="fa-regular fa-envelope-open"></i>
            Cover
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-ring"></i>
            Couple
        </a>
        <a href="#" class="nav-item">
            <i class="fa-regular fa-calendar-check"></i>
            Event
        </a>
        <a href="#" class="nav-item">
            <i class="fa-regular fa-images"></i>
            Gallery
        </a>
        <a href="#" class="nav-item">
            <i class="fa-regular fa-comment-dots"></i>
            Wishes
        </a>
    </nav>

    <script>
        // --- Script untuk Slideshow ---
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        const slideInterval = 5000; // Durasi per slide (ms), misalnya 5 detik

        function nextSlide() {
            slides[currentSlide].classList.remove('active'); // Sembunyikan slide sekarang
            currentSlide = (currentSlide + 1) % slides.length; // Hitung index slide berikutnya
            slides[currentSlide].classList.add('active'); // Tampilkan slide berikutnya
        }

        // Jalankan slideshow secara otomatis
        setInterval(nextSlide, slideInterval);
        // ------------------------------

        // Script sederhana untuk countdown (tetap sama)
        const targetDate = new Date("Dec 3, 2025 08:00:00").getTime();

        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? "0"+d : (d < 0 ? "00" : d);
            document.getElementById("hours").innerText = h < 10 ? "0"+h : (h < 0 ? "00" : h);
            document.getElementById("minutes").innerText = m < 10 ? "0"+m : (m < 0 ? "00" : m);
            document.getElementById("seconds").innerText = s < 10 ? "0"+s : (s < 0 ? "00" : s);
        }, 1000);

        // Contoh sederhana kontrol musik (perlu tag audio aktif)

        let isPlaying = false;

            if (isPlaying) {
                audio.pause();
                musicBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            } else {
                audio.play().catch(error => {
                    console.log("Autoplay dicegah oleh browser, perlu interaksi user.");
                });
                musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        });
        */
    </script>

</body>
</html>
